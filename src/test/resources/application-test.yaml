spring:
  cache:
    type: none
  init:
    mode: always
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    port: ${MAIL_PORT}
    properties:
      mail:
        smtp:
          starttls:
            enable: false
          auth: false

MAIL_HOST: localhost
MAIL_USERNAME: test
MAIL_PASSWORD: test
MAIL_PORT: 1025
DB_URL: jdbc:postgresql://localhost:5433/jira-test
DB_USERNAME: jira
DB_PASSWORD: JiraRush
